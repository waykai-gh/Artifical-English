name: Release checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: english
          POSTGRES_DB: english_ci
          POSTGRES_PASSWORD: synthetic-ci-database-password
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U english -d english_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgresql://english:synthetic-ci-database-password@localhost:5432/english_ci
      - run: npm audit --audit-level=high
      - name: Scan Git history for secrets
        run: |
          mkdir -p .tmp
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o .tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .tmp/gitleaks.tar.gz -C .tmp gitleaks
          .tmp/gitleaks git --redact --no-banner .
      - name: Build production image and verify local voice with container restrictions
        run: |
          docker build -t english-bot:ci .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --tmpfs /tmp:size=192m,mode=1777,noexec,nosuid -v "$PWD/scripts/container-smoke.mjs:/app/container-smoke.mjs:ro" english-bot:ci node container-smoke.mjs
      - name: Validate production configuration and shell scripts
        run: |
          node scripts/check-compose.mjs english-bot:ci
          bash -n scripts/backup.sh scripts/restore-check.sh scripts/scheduled-restore.sh scripts/watchdog.sh scripts/install-ops.sh
